services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce_development
    ports:
      - "5434:5432"
    networks:
      - ecommerce_network

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.dev
    command: ./bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./backend-api:/rails
      - /rails/node_modules
      - /rails/public/packs
      - /rails/tmp
      - rails_storage:/rails/storage
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:password@db:5432/ecommerce_development
      # Run the Solid Queue worker inside Puma (single process for local development)
      SOLID_QUEUE_IN_PUMA: "1"
      # Order emails are delivered to Mailpit: open http://localhost:8025 to read them
      SMTP_ADDRESS: mailpit
      SMTP_PORT: "1025"
      CLIENT_URL: http://localhost:5173
    depends_on:
      - db
      - mailpit
    stdin_open: true
    tty: true
    networks:
      - ecommerce_network

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI for inspecting sent emails
      - "1025:1025"   # SMTP
    networks:
      - ecommerce_network

  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./web-app:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
  rails_storage:
