services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ecommerce_production
    networks:
      - ecommerce_network_prod
    restart: always

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile.prod
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-password}@db:5432/ecommerce_production
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Background jobs (order emails) run inside Puma via Solid Queue
      SOLID_QUEUE_IN_PUMA: "1"
      CLIENT_URL: ${CLIENT_URL:-https://zilvo.ddns.net}
      MAIL_FROM: ${MAIL_FROM:-Zilvo <orders@zilvo.ddns.net>}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - db
    volumes:
      - rails_storage_prod:/rails/storage
    expose:
      - "3000"
    networks:
      - ecommerce_network_prod
    restart: always

  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    networks:
      - ecommerce_network_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

networks:
  ecommerce_network_prod:
    driver: bridge

volumes:
  postgres_data_prod:
  rails_storage_prod:
